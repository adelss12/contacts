<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل أرقامي</title>
    <!-- إعدادات أيقونة الآيفون -->
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="أرقامي">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
    <div class="logo">د</div>

    <div>
        <h1>دليل أرقامي</h1>
        <p>دفتر أرقامك الشخصي</p>
        <p id="contactsCount">عدد الأسماء: 0</p>
    </div>
</header>
<main class="app-card">
    <div class="sticky-search">
    <input
            type="search"
            id="searchInput"
            placeholder="ابحث بالاسم أو رقم الهاتف"
        >
    </div>

    <div class="toolbar">
        

        <button id="importButton">استيراد VCF</button>

        <input
            type="file"
            id="vcfInput"
            accept=".vcf"
            hidden
        >

        <button id="exportButton">تصدير نسخة</button>
        <button id="csvExportButton">تصدير Excel</button>

        <button id="deleteAllButton" class="danger-button">
            حذف الجميع
        </button>
    </div>

    <section id="contactsList" class="contacts-list">
        <div class="empty-state">
            <h2>دليلك جاهز</h2>
            <p>استورد ملف جهات الاتصال VCF للبدء.</p>
        </div>
    </section>
</main>
    <script src="app.js"></script>
    
</body>
</html>
